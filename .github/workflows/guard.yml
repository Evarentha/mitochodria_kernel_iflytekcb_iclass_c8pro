name: purity-guard

# Mitochodria C8Pro-only kernel repository guard.
# Fails if other-device content or previously-removed build glue/junk
# ever reappears (e.g. via a careless wholesale import or add -A).

on: [push, pull_request]

jobs:
  forbidden-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: reject other-device and junk paths
        run: |
          ! git ls-files | grep -E \
            '(^|/)istudy|iflytek_istudy|(^|/)iclass-c8pro\.dts|(^|/)source/|^scripts_out/|AndroidKernel\.mk|^build\.config\.(cuttlefish|goldfish)|^verity_dev_keys\.x509|^build\.sh$|sprd-board-config'
      - name: reject C10 keywords in commit messages
        run: |
          ! git log --format='%s %B' | grep -iE 'istudy|tx20' | grep -iE 'c10' | head -1
